[package]
name = "xan"
version = "0.62.0-rc.1"
rust-version = "1.88.0"
authors = [
  "Guillaume Plique <guillaume.plique@sciencespo.fr>",
  "Béatrice Mazoyer <beatrice.mazoyer@sciencespo.fr>",
  "Laura Miguel <laura.miguel@sciencespo.fr>",
  "César Pichon <cesar.pichon@sciencespo.fr>",
  "Anna Charles <anna.charles@sciencespo.fr>",
  "Julien Pontoire <julien.pontoire@sciencespo.fr>",
  "Evan Chevalerias <evan.chevalerias@sciencespo.fr>"
]
description = "The CSV magician"
documentation = "https://github.com/medialab/xan#readme"
homepage = "https://github.com/medialab/xan"
repository = "https://github.com/medialab/xan"
readme = "README.md"
keywords = ["csv", "tsv", "cli"]
license = "Unlicense OR MIT"
autotests = false
edition = "2024"
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE-MIT",
  "UNLICENSE",
  "src/**/*.rs",
  "src/moonblade/grammar.pest",
  "src/moonblade/doc/*.json",
  "src/moonblade/doc/*.md",
  "src/moonblade/doc/*.txt",
  "tests/**/*.rs"
]

[[bin]]
name = "xan"
test = true
bench = false
doctest = false

[[test]]
name = "tests"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

[profile.release-debug]
inherits = "release"
codegen-units = 16
strip = false
debug = true
lto = false

[dependencies]
ahash = "0.8.12"
aho-corasick = "1.1.5"
arrayvec = "0.7.8"
base64 = "0.23.1"
bgzip = { version = "0.3.1", features = ["rust_backend"]}
binary-heap-plus = "0.5.0"
bstr = "1.13.1"
btoi = "0.5.0"
bytesize = "2.7.0"
calamine = "0.36.1"
colored = "3.1.1"
colorgrad = { version = "0.8.0", default-features = false, features = ["preset"] }
compare = "0.1.0"
console = "0.16.6"
csv = "1.3.1"
comrak = { version = "0.55.0", default-features = false }
dlv-list = "0.6.0"
docopt = "1"
ego-tree = "0.11.0"
emojis = "0.9.0"
encoding = "0.2.33"
enumset = "1.1.14"
fast-float2 = "0.2.4"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
glob = "0.3.4"
heavykeeper = "0.7.1"
html-escape = "0.2.15"
hyperloglogplus = "0.4.1"
idna = "1.1.0"
indexmap = "2.14.2"
indicatif = "0.18.6"
itoa = "1.0.18"
jiff = "0.2.37"
lazy_static = "1.4.0"
levenshtein_automata = "0.2.1"
md5 = "0.8.1"
mime2ext = "0.1.53"
namedlock = "0.7.0"
numfmt = "1.2.0"
num_cpus = "1.4"
npyz = "0.9.1"
opener = "0.8.5"
ordered-float = "5.3.0"
pad = "0.1.6"
paltoquet = "0.12.0"
pariter = "0.6.0"
parquet = { version = "60.0.0", default-features = false, features = ["flate2-zlib-rs", "brotli", "snap", "zstd", "lz4", "json", "simdutf8"]}
pest = "2.9.1"
pest_derive = "2.9.1"
phylacter = "0.3.0"
py_literal = "0.4.0"
quick-xml = "0.42.0"
rand = "0.10.2"
rand_chacha = "0.10.0"
rand_seeder = "0.5.0"
ratatui = { version = "0.30.2", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
regex-automata = "0.4.18"
rust_xlsxwriter = "0.99.1"
scraper = "0.27.0"
serde = { version = "1", features = ["rc"] }
serde_derive = "1"
serde_json = { version = "1.0", features = ["preserve_order"] }
shlex = "2.0.1"
simd-csv = { version = "0.13.0", features = ["str"]}
simd-json = "0.18.1"
sprintf = "0.4.1"
tar = { version = "0.4.46", default-features = false }
tdigest = "1.0.1"
tempfile = "3.27.0"
termsize = "0.1.8"
textwrap = "0.16.4"
toml = "1.1.6"
topk = "0.7.0"
transient-btree-index = "0.5.1"
unidecode = "0.3.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
zmij = "1.0.23"
zstd = "0.14.0"

# NOTE: pager does not work on windows
[target.'cfg(not(windows))'.dependencies]
pager = "0.16.1"

# NOTE: musl's default allocator seems to be very slow
[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
jemallocator = "0.5.4"
